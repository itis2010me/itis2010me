<head>
  <meta charset="utf-8">

  <meta name="twitter:card" content="summary">
  <script>
    const t=localStorage.getItem('theme');
    if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))
      document.documentElement.setAttribute('data-theme','dark');
    if(sessionStorage.getItem('pt-state')){
      document.documentElement.classList.add('pt-incoming');
      /* Failsafe: pt-incoming hides the body until the curtain paints. If
         transition.js never runs, this stops the page being blank forever. */
      addEventListener('load',function(){
        document.documentElement.classList.remove('pt-incoming');
      });
    }
  </script>
  <link rel="stylesheet" href="ascii.css" blocking="render">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body class="landing">
  <h1 class="greeting">Hello, I'm Merlin</h1>
  <nav class="nav">
    <a href="about.html">About</a>
    <a href="work.html">Work</a>
    <a href="projects.html">Projects</a>
  </nav>
  <pre id="out" aria-label="|'L'|"></pre>
  <footer class="footer landing-footer">Merlin Chang © 2026</footer>
  <button id="theme-toggle" class="dark-toggle" aria-label="Toggle dark mode"></button>
  <script src="theme.js"></script>
  <!-- Curtain first: deferred scripts run in order, and the mascot's setup
       (font measuring, face render, getImageData) would otherwise delay the
       incoming reveal on every navigation back to this page. -->
  <script src="glyph-atlas.js" defer></script>
  <script src="transition.js" defer></script>
  <script src="ascii.js" defer></script>
</body>
</html>
